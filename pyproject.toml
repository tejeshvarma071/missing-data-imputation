[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "missing-data-imputation-research"
version = "0.1.0"
description = "Reusable core utilities for the missing-data imputation research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["missing_data_imputation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
